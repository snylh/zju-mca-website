<!DOCTYPE html>
<html lang="zh-CN" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面走丢了 | 浙大魔协</title>
  <meta name="description" content="这个页面好像被变没了。回到浙大魔协首页，或者去魔方实验室转转。">
  <meta name="theme-color" content="#0B0618">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/main.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 120px 24px 80px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .error-page::before {
      content: "404";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: var(--font-latin);
      font-size: clamp(240px, 46vw, 640px);
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1px rgba(245, 194, 107, 0.07);
      pointer-events: none;
    }
    .error-inner { position: relative; z-index: 2; max-width: 560px; }
    .error-cube {
      width: 72px;
      height: 72px;
      margin: 0 auto 34px;
      border: 1px solid rgba(245, 194, 107, 0.45);
      border-radius: 14px;
      transform: rotate(45deg);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      padding: 10px;
      box-shadow: 0 0 50px rgba(245, 194, 107, 0.16);
      animation: errSpin 14s linear infinite;
    }
    .error-cube i { border-radius: 3px; background: var(--gold); }
    .error-cube i:nth-child(2) { background: var(--cyan); }
    .error-cube i:nth-child(3) { background: var(--pink); }
    .error-cube i:nth-child(4) { background: var(--violet); }
    @keyframes errSpin { to { transform: rotate(405deg); } }
    .error-kicker { font-size: 9px; letter-spacing: 0.34em; color: var(--gold); }
    .error-inner h1 {
      margin: 18px 0 16px;
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: 0.04em;
    }
    .error-inner p { font-size: 13.5px; line-height: 2; color: var(--muted); }
    .error-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
  </style>
</head>
<body>
  <main class="error-page">
    <div class="error-inner">
      <div class="error-cube" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <p class="error-kicker">404 · LOST IN THE TRICK</p>
      <h1>这个页面，被变没了。</h1>
      <p>它可能被装进了魔术帽，也可能只是链接写错了。<br>回到首页，或者去魔方实验室把它转回来。</p>
      <div class="error-actions">
        <a class="btn btn-gold" href="index.html"><span>回到浙大魔协</span><svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg></a>
        <a class="btn btn-ghost" href="lab/"><span>去魔方实验室</span></a>
      </div>
    </div>
  </main>
  <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></symbol>
  </svg>
</body>
</html>
